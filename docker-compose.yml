
services:
  webql:
    image: webql:1.0.0
    container_name: webql
    restart: always
    build:
      context: ./webql
      dockerfile: Dockerfile
    networks:
      - graphqlastic-net
    ports:
      - 5173:5173
    expose:
      - 5173
    develop:
      watch:
        - action: sync
          path: ./webql/src
          target: ./web/src
          ignore:
            - ./web/node_modules
        - action: rebuild
          path: ./web/package.json
    volumes:
      - ./webql:/webql
      - /webql/node_modules
    environment:
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
  
  server:
    image: server:1.0.0
    container_name: server
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - 5051:5051
    env_file:
      - .env
    networks:
      - graphqlastic-net
    volumes:
      - ./server:/server
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - POSTGRES_URL=postgres://postgres:postgres@postgres:5432/graphqlastic?sslmode=disable
    depends_on:
      - elasticsearch
      - postgres

  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=graphqlastic
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - graphqlastic-net

  pgadmin:
    image: dpage/pgadmin4:8.12
    container_name: pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    networks:
      - graphqlastic-net
    depends_on:
      - postgres

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    networks:
      - graphqlastic-net
    
networks:
  graphqlastic-net:
    driver: bridge

volumes:
  nodemodules: {}
  esdata:
    driver: local
  pgdata:
    driver: local
  pgadmindata:
    driver: local