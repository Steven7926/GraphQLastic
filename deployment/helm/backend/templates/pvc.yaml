{{- range .Values.pvcs }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .name }}-pvc
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml (default (list "ReadWriteOnce") .accessModes) | nindent 4 }}
  {{- if .storageClassName }}
  storageClassName: {{ .storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .size }}
{{- end }}