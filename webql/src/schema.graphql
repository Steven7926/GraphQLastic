scalar Cursor
scalar UUID

enum SearchSource {
  ELASTICSEARCH
  POSTGRES
}

enum EntityType {
  PERSON
  COMPANY
}

enum UsState {
  CA
  CO
  DC
  FL
  GA
  MD
  NY
  TX
  VA
  WA
}

enum RegistrationStatus {
  ACTIVE
  INACTIVE
  EXPIRED
  PENDING
}

type Query {
  samEntities(
    first: Int
    offset: Int
    before: Cursor
    after: Cursor
    search: String
    source: SearchSource = ELASTICSEARCH
    type: EntityType
    state: UsState
    status: RegistrationStatus
  ): SamEntityConnection
}

type SamEntity {
  id: UUID!
  name: String!
  cageCode: String
  type: String
  uei: String
  city: String
  state: String
  status: String
}

type SamEntityConnection {
  nodes: [SamEntity!]!
  edges: [SamEntityEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  totalSearch: Int!
}

type SamEntityEdge {
  cursor: Cursor!
  node: SamEntity!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: Cursor
  endCursor:Cursor
}